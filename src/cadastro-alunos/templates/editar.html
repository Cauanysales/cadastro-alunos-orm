<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar aluno</title>
</head>
<body>

    <h1>Editar aluno</h1>

    <form method="POST">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="{{ aluno.nome }}" required>
        <br><br>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" value="{{ aluno.cpf }}" required>
        <br><br>

        <label for="data_nascimento">Data de nascimento:</label>
        <input type="text" id="data_nascimento" name="data_nascimento" value="{{ aluno.data_nascimento }}" required>
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" value="{{ aluno.email }}" required>
        <br><br>

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone" value="{{ aluno.telefone }}" required>
        <br><br>

        <label for="curso">Curso:</label>
        <input type="text" id="curso" name="curso" value="{{ aluno.curso }}" required>
        <br><br>

        <label for="matricula">Matrícula:</label>
        <input type="text" id="matricula" name="matricula" value="{{ aluno.matricula }}" required>
        <br><br>

        <button type="submit">Salvar alterações</button>

    </form>

    <br>

    <a href="{{ url_for('main.index') }}">Voltar para lista</a>

</body>
</html>
